plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "hypixelcustomrecipe" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "eu.pb4:polymer-core:0.17.5+26.2"
    // Compile against Polymer's textured-block and resource-pack APIs.
    // The server still supplies these modules through polymer-bundled.
    modCompileOnly "eu.pb4:polymer-blocks:0.17.5+26.2"
    modCompileOnly "eu.pb4:polymer-resource-pack:0.17.5+26.2"
}

def modVersion = project.version
processResources {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

base {
    archivesName = "hypixelcustomrecipe"
}
